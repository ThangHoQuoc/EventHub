<svg xmlns="http://www.w3.org/2000/svg" width="880" height="594" viewBox="0 0 880 594" role="img">
<title>EXPIRED: lỗi nghiệp vụ vẫn commit nhánh quá hạn</title><desc>Hai đường cùng commit EXPIRED. Riêng exception hết hạn không rollback; lỗi reserve Booking vẫn rollback toàn bộ accept. Reload DB để kiểm chứng, không chỉ verify save trong mock.</desc>
