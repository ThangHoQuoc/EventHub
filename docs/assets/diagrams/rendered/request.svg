<rect x="110" y="198" width="700" height="80" rx="12" fill="#fff1d9" stroke="#ad791e" stroke-width="1.6"/>
<text x="460.0" y="233.0" text-anchor="middle" font-size="17" fill="#18334e">JwtAuthenticationFilter + SecurityConfig</text>
