<text x="460.0" y="267.0" text-anchor="middle" font-size="17" fill="#18334e">Reserve và save booking trong một transaction</text>
<rect x="30" y="370" width="400" height="90" rx="12" fill="#e8f1fc" stroke="#3872ac" stroke-width="1.6"/>
<text x="230.0" y="410.0" text-anchor="middle" font-size="17" fill="#18334e">Confirm payment</text>
<text x="230.0" y="432.0" text-anchor="middle" font-size="17" fill="#18334e">Giữ counter → CONFIRMED</text>
<rect x="490" y="370" width="400" height="90" rx="12" fill="#e8f1fc" stroke="#3872ac" stroke-width="1.6"/>
<text x="690.0" y="410.0" text-anchor="middle" font-size="17" fill="#18334e">Cancel / expire pending</text>
<text x="690.0" y="432.0" text-anchor="middle" font-size="17" fill="#18334e">Khóa type, trừ counter</text>
<rect x="110" y="550" width="700" height="80" rx="12" fill="#fce8e6" stroke="#b65349" stroke-width="1.6"/>
