<text x="632" y="380" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172b45" text-anchor="start" data-owner="branch-1">
<tspan x="632" dy="0">TICKET_NOT_FOUND</tspan>
</text>
<path d="M516 423.0 L620 423.0" fill="none" stroke="#ad4b38" stroke-width="2" marker-end="url(#error-arrow)"/>
<text x="568.0" y="409.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#ad4b38" text-anchor="middle">
<tspan x="568.0" dy="0">Thiếu</tspan>
</text>
<path id="node-2" d="M60 544 H494 L516 566 V668 L494 690 H60 L38 668 V566Z" fill="#e9f2fb" stroke="#54728f" stroke-width="2"/>
<text x="56" y="571" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52667d" text-anchor="start" data-owner="node-2">
<tspan x="56" dy="0">03  ĐIỀU KIỆN</tspan>
</text>
<text x="56" y="602" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#172b45" text-anchor="start" data-owner="node-2">
<tspan x="56" dy="0">ADMIN hoặc ORGANIZER chủ Event?</tspan>
</text>
<path d="M277.0 690 L277.0 738" fill="none" stroke="#54728f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="291.0" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#52667d" text-anchor="start">
<tspan x="291.0" dy="0">Có quyền</tspan>
</text>
<rect x="620" y="544" width="230" height="146" rx="10" fill="#fff1ed" stroke="#ad4b38" stroke-width="1.5" id="branch-2"/>
<text x="632" y="574" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172b45" text-anchor="start" data-owner="branch-2">
<tspan x="632" dy="0">UNAUTHORIZED</tspan>
</text>
<path d="M516 617.0 L620 617.0" fill="none" stroke="#ad4b38" stroke-width="2" marker-end="url(#error-arrow)"/>
<text x="568.0" y="603.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#ad4b38" text-anchor="middle">
<tspan x="568.0" dy="0">Không</tspan>
</text>
<path id="node-3" d="M60 738 H494 L516 760 V862 L494 884 H60 L38 862 V760Z" fill="#e9f2fb" stroke="#54728f" stroke-width="2"/>
<text x="56" y="765" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52667d" text-anchor="start" data-owner="node-3">
<tspan x="56" dy="0">04  ĐIỀU KIỆN</tspan>
</text>
<text x="56" y="796" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#172b45" text-anchor="start" data-owner="node-3">
<tspan x="56" dy="0">Ticket đang VALID?</tspan>
</text>
<path d="M277.0 884 L277.0 932" fill="none" stroke="#54728f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="291.0" y="918" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#52667d" text-anchor="start">
<tspan x="291.0" dy="0">Đúng</tspan>
</text>
<rect x="620" y="738" width="230" height="146" rx="10" fill="#fff1ed" stroke="#ad4b38" stroke-width="1.5" id="branch-3"/>
<text x="632" y="768" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172b45" text-anchor="start" data-owner="branch-3">
<tspan x="632" dy="0">INVALID_REQUEST</tspan>
</text>
<path d="M516 811.0 L620 811.0" fill="none" stroke="#ad4b38" stroke-width="2" marker-end="url(#error-arrow)"/>
<text x="568.0" y="797.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#ad4b38" text-anchor="middle">
<tspan x="568.0" dy="0">Không</tspan>
</text>
<rect x="38" y="932" width="478" height="146" rx="10" fill="white" stroke="#bacdde" stroke-width="1.5" id="node-4"/>
<text x="56" y="959" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52667d" text-anchor="start" data-owner="node-4">
<tspan x="56" dy="0">05  THAO TÁC</tspan>
</text>
<text x="56" y="990" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#172b45" text-anchor="start" data-owner="node-4">
<tspan x="56" dy="0">set USED; checkedInAt=now → save</tspan>
</text>
<path d="M277.0 1078 L277.0 1126" fill="none" stroke="#54728f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="291.0" y="1112" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#52667d" text-anchor="start">
<tspan x="291.0" dy="0">Tiếp</tspan>
</text>
<rect x="38" y="1126" width="478" height="146" rx="10" fill="#eaf6ef" stroke="#bacdde" stroke-width="1.5" id="node-5"/>
<text x="56" y="1153" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52667d" text-anchor="start" data-owner="node-5">
<tspan x="56" dy="0">06  THAO TÁC</tspan>
</text>
<text x="56" y="1184" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#172b45" text-anchor="start" data-owner="node-5">
<tspan x="56" dy="0">TicketResponse; không có guard giờ</tspan>
<tspan x="56" dy="29.700000000000003">Event ở method này</tspan>
</text>
<text x="28" y="1325" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#52667d" text-anchor="start">
<tspan x="28" dy="0">Đi xuống: tiếp tục · Rẽ phải: kết quả khác và dừng nhánh đó</tspan>
</text>
