<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1550" viewBox="0 0 880 1550" role="img">
<title>Filter: từ Bearer token đến Authentication</title><desc>Đi xuống theo nhánh hợp lệ; rẽ phải khi điều kiện không đạt. Filter đi tiếp chưa xác thực không đồng nghĩa mọi URL đều trả 401: policy URL quyết định phía sau.</desc>
