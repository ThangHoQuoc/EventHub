<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" role="img" aria-labelledby="title desc">
<title id="title">Counter tồn kho trong working tree</title>
<desc id="desc">Confirm và cancel/expire là các nhánh thay thế của pending, không phải lần lượt confirm rồi cancel. soldQuantity đang đếm chỗ chiếm, gồm pending.</desc>
