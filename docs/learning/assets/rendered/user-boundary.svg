<svg xmlns="http://www.w3.org/2000/svg" width="880" height="594" viewBox="0 0 880 594" role="img">
<title>User entity và UserResponse có mục đích khác nhau</title><desc>So từng dòng theo mục đích. Password tồn tại trong entity không phải lý do serialize entity ra API. Mapper chỉ ánh xạ hợp đồng đã định, không tự quyết quyền xem.</desc>
