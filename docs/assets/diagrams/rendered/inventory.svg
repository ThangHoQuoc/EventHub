<path d="M690.0,460 L690.0,505.0 L460.0,505.0 L460.0,542" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="80" width="700" height="80" rx="12" fill="#e8f1fc" stroke="#3872ac" stroke-width="1.6"/>
<text x="460.0" y="115.0" text-anchor="middle" font-size="17" fill="#18334e">Khả dụng = quantity - soldQuantity</text>
<text x="460.0" y="137.0" text-anchor="middle" font-size="17" fill="#18334e">Không có reservedQuantity</text>
<rect x="110" y="210" width="700" height="80" rx="12" fill="#e8f1fc" stroke="#3872ac" stroke-width="1.6"/>
