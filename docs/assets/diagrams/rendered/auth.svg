<svg xmlns="http://www.w3.org/2000/svg" width="920" height="788" viewBox="0 0 920 788" role="img" aria-labelledby="title desc">
<title id="title">Đăng nhập và request mang JWT</title>
<desc id="desc">Role cuối cùng lấy từ User DB; thiếu/sai token đi tiếp như chưa xác thực.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#526579"/></marker></defs>
<rect width="100%" height="100%" fill="#f6f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="460.0" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#142c46">Đăng nhập và request mang JWT</text>
<path d="M460.0,160 L460.0,179.0 L460.0,179.0 L460.0,190" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M460.0,278 L460.0,297.0 L460.0,297.0 L460.0,308" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M460.0,396 L460.0,415.0 L460.0,415.0 L460.0,426" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M460.0,514 L460.0,533.0 L460.0,533.0 L460.0,544" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M460.0,632 L460.0,651.0 L460.0,651.0 L460.0,662" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="80" width="700" height="80" rx="12" fill="#e8f1fc" stroke="#3872ac" stroke-width="1.6"/>
<text x="460.0" y="115.0" text-anchor="middle" font-size="17" fill="#18334e">POST /auth/login public</text>
<text x="460.0" y="137.0" text-anchor="middle" font-size="17" fill="#18334e">LoginRequest qua MVC validation</text>
<rect x="110" y="198" width="700" height="80" rx="12" fill="#fff1d9" stroke="#ad791e" stroke-width="1.6"/>
<text x="460.0" y="233.0" text-anchor="middle" font-size="17" fill="#18334e">AuthServiceImpl.login</text>
<text x="460.0" y="255.0" text-anchor="middle" font-size="17" fill="#18334e">findByEmail → matches → yêu cầu ACTIVE</text>
<rect x="110" y="316" width="700" height="80" rx="12" fill="#e8f1fc" stroke="#3872ac" stroke-width="1.6"/>
<text x="460.0" y="351.0" text-anchor="middle" font-size="17" fill="#18334e">JwtServiceImpl.generateToken</text>
<text x="460.0" y="373.0" text-anchor="middle" font-size="17" fill="#18334e">Ký subject=userId, claims và thời hạn</text>
<rect x="110" y="434" width="700" height="80" rx="12" fill="#e8f1fc" stroke="#3872ac" stroke-width="1.6"/>
<text x="460.0" y="469.0" text-anchor="middle" font-size="17" fill="#18334e">Client gửi request tiếp theo với Bearer token</text>
<text x="460.0" y="491.0" text-anchor="middle" font-size="17" fill="#18334e">Token không thay thế resource ownership</text>
<rect x="110" y="552" width="700" height="80" rx="12" fill="#fff1d9" stroke="#ad791e" stroke-width="1.6"/>
<text x="460.0" y="587.0" text-anchor="middle" font-size="17" fill="#18334e">JwtAuthenticationFilter</text>
<text x="460.0" y="609.0" text-anchor="middle" font-size="17" fill="#18334e">Verify token → tải User ACTIVE từ DB</text>
<rect x="110" y="670" width="700" height="80" rx="12" fill="#e0f4ed" stroke="#24836d" stroke-width="1.6"/>
<text x="460.0" y="705.0" text-anchor="middle" font-size="17" fill="#18334e">SecurityContext: principal=userId, ROLE từ DB</text>
<text x="460.0" y="727.0" text-anchor="middle" font-size="17" fill="#18334e">URL/method role → service ownership</text>
<text x="460.0" y="770" text-anchor="middle" font-size="13" fill="#53667b">Working tree 09/10/2026 · Mũi tên theo quan hệ/luồng được ghi trong bài</text>
</g></svg>
