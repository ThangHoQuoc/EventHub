<svg xmlns="http://www.w3.org/2000/svg" width="880" height="578" viewBox="0 0 880 578" role="img">
<title>Token hợp lệ chưa phải quyền thao tác tài nguyên</title><desc>Đọc từng hàng từ trái sang phải. Cột giữa giải thích vì sao role claim không là authority cuối. Policy URL/method và ownership là các quyết định tiếp sau xác thực.</desc>
