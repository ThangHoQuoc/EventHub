<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1162" viewBox="0 0 880 1162" role="img">
<title>Payment: chọn replay hay xác nhận mới</title><desc>Khóa Booking trước lookup reference. Retry cùng booking chờ transaction trước commit; nhánh replay trả kết quả cũ. Collision cùng key trên hai booking khác vẫn dựa vào unique DB.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54728f"/></marker><marker id="error-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ad4b38"/></marker></defs>
<rect width="880" height="1162" rx="12" fill="#f8fafc"/>
<text x="28" y="38" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#172b45" text-anchor="start">
<tspan x="28" dy="0">Payment: chọn replay hay xác nhận mới</tspan>
</text>
<text x="28" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#52667d" text-anchor="start">
<tspan x="28" dy="0">confirmPayment · key = provider + providerTransactionId</tspan>
</text>
<rect x="38" y="156" width="478" height="146" rx="10" fill="white" stroke="#bacdde" stroke-width="1.5" id="node-0"/>
<text x="56" y="183" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52667d" text-anchor="start" data-owner="node-0">
<tspan x="56" dy="0">01  THAO TÁC</tspan>
</text>
<text x="56" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#172b45" text-anchor="start" data-owner="node-0">
<tspan x="56" dy="0">ADMIN/@Valid → validateRequest</tspan>
</text>
<path d="M277.0 302 L277.0 350" fill="none" stroke="#54728f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="291.0" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#52667d" text-anchor="start">
<tspan x="291.0" dy="0">Tiếp</tspan>
</text>
<rect x="38" y="350" width="478" height="146" rx="10" fill="white" stroke="#bacdde" stroke-width="1.5" id="node-1"/>
<text x="56" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52667d" text-anchor="start" data-owner="node-1">
<tspan x="56" dy="0">02  THAO TÁC</tspan>
</text>
<text x="56" y="408" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#172b45" text-anchor="start" data-owner="node-1">
<tspan x="56" dy="0">Khóa Booking theo bookingId</tspan>
</text>
<path d="M277.0 496 L277.0 544" fill="none" stroke="#54728f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="291.0" y="530" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#52667d" text-anchor="start">
<tspan x="291.0" dy="0">Tiếp</tspan>
</text>
<rect x="620" y="350" width="230" height="146" rx="10" fill="#fff1ed" stroke="#ad4b38" stroke-width="1.5" id="branch-1"/>
<text x="632" y="380" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#172b45" text-anchor="start" data-owner="branch-1">
<tspan x="632" dy="0">BOOKING_NOT_FOUND</tspan>
</text>
<path d="M516 423.0 L620 423.0" fill="none" stroke="#ad4b38" stroke-width="2" marker-end="url(#error-arrow)"/>
<text x="568.0" y="409.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#ad4b38" text-anchor="middle">
<tspan x="568.0" dy="0">Thiếu</tspan>
</text>
<path id="node-2" d="M60 544 H494 L516 566 V668 L494 690 H60 L38 668 V566Z" fill="#e9f2fb" stroke="#54728f" stroke-width="2"/>
<text x="56" y="571" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52667d" text-anchor="start" data-owner="node-2">
