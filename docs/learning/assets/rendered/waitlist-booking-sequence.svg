<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1350" viewBox="0 0 880 1350" role="img">
<title>Accept: reuse Booking trong transaction đang có</title><desc>BookingService dùng current customer của request accept. Chỉ sau booking thành công mới ghi convertedBookingId và các state converted; lỗi booking làm operation accept rollback.</desc>
