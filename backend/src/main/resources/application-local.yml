# ==============================================================================
# PROFILE: LOCAL (Phát triển cục bộ trên máy tính cá nhân)
# Kết nối PostgreSQL Local (Docker Compose port 5433 hoặc Postgres máy cài trực tiếp)
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5433}/${LOCAL_DB_NAME:eventhub}}
    username: ${SPRING_DATASOURCE_USERNAME:${LOCAL_DB_USER:eventhub}}
    password: ${SPRING_DATASOURCE_PASSWORD:${LOCAL_DB_PASSWORD:eventhub}}
    hikari:
      pool-name: EventHubHikariPool-LOCAL
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.eventhub.eventhub_backend: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
