<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1216" viewBox="0 0 880 1216" role="img">
<title>Login: kiểm credentials rồi mới cấp token</title><desc>Đọc từ trên xuống. Login dùng credentials; Authentication của request sau được tạo ở filter, không ở bước cấp token này.</desc>
