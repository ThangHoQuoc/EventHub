<text x="460.0" y="373.0" text-anchor="middle" font-size="17" fill="#18334e">Body sai có thể bị trả lỗi trước controller</text>
<rect x="110" y="434" width="700" height="80" rx="12" fill="#e8f1fc" stroke="#3872ac" stroke-width="1.6"/>
<text x="460.0" y="469.0" text-anchor="middle" font-size="17" fill="#18334e">Controller / @PreAuthorize</text>
<text x="460.0" y="491.0" text-anchor="middle" font-size="17" fill="#18334e">Nhận input, gọi service, đóng gói response</text>
<rect x="110" y="552" width="700" height="80" rx="12" fill="#fff1d9" stroke="#ad791e" stroke-width="1.6"/>
